name: Package Windows Store update

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build and validate the Store package
        run: npm run build:store --workspace electronApp

      - name: Upload the AppX package
        uses: actions/upload-artifact@v4
        with:
          name: podbbang-unofficial-store-0.1.7.0-x64
          path: electronApp/dist/*.appx
          if-no-files-found: error
          retention-days: 14
